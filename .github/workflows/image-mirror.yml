name: Mirror container images

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * 1" # Once a week.
  push:
    branches:
      # - main
    paths:
      - .github/workflows/image-mirror.yml

concurrency:
  group: image-mirror
  cancel-in-progress: false

permissions: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    name: ${{ matrix.image }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/alpine:latest
          # - docker.io/curlimages/curl:8.4.0
          # - docker.io/influxdb:1.8
          # - docker.io/mysql:9.0
          # - docker.io/mysql:latest
          # - docker.io/michelvocks/docker-test-openldap:latest
          # - docker.io/cassandra:5.0.8
          # - docker.io/rabbitmq:4-management
          # - docker.io/jumanjiman/radiusd:latest
          # - docker.io/linuxserver/openssh-server:8.1_p1-r0-ls20
          # - docker.io/linuxserver/openssh-server:8.4_p1-r3-ls48
          # - docker.io/nginx:latest
          # - docker.io/certbot/certbot:latest
          # - docker.io/caddy:2.6.4
          # - docker.io/postgres:latest
          # - docker.io/postgres:17
    steps:
      - name: Download crane
        env:
          OS: Linux
          ARCH: x86_64
          VERSION: v0.21.7
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo google/go-containerregistry \
            --pattern "go-containerregistry_${OS}_${ARCH}.tar.gz" \
            "$VERSION" -O - | tar -xzf -

      - name: Log in to registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: docker login ghcr.io -u "$REPOSITORY_OWNER" --password-stdin <<< "$GITHUB_TOKEN"

      - name: Get lowercased organization name
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        # Container image references expect lowercase characters only, so for
        # ghcr.io we must normalize the organization name to account for any
        # forks that would like to use this workflow.
        # Also see https://github.com/orgs/community/discussions/25768.
        run: echo "ORG=${REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Mirror image
        env:
          IMAGE: ${{ matrix.image }}
        run: ./crane copy "$IMAGE" "ghcr.io/${ORG}/mirror/${IMAGE}"
