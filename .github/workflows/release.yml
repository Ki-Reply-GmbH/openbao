# Creates a GitHub Release.
# Workflow is manually run.
# Preselect branch before running this workflow.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g., v2.0.0
        required: true
        type: string
      prerelease:
        description: Mark as pre-release version
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  setup:
    runs-on: ubuntu-slim
    steps:
      # Avoid creating the initial release resource via GoReleaser to stop
      # parallel runs from racing against each other and creating multiple
      # releases.
      - name: Create draft release
        run: |
          gh release create \
            --draft \
            --target='${{ github.sha }}' \
            --prerelease='${{ inputs.prerelease }}' \
            --title='${{ inputs.version }}' \
            --repo='${{ github.repository }}' \
            '${{ inputs.version }}'
        env:
          GH_TOKEN: ${{ github.token }}

  build-ui-dist:
    runs-on: ubuntu-latest
    needs:
      - setup
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Node setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ui/package.json

      - name: PNPM setup
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: ui/package.json

      - name: UI Cache Setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            http/web_ui/
          key: ${{ github.ref }}-ui

      - name: Build UI
        id: ui-build
        run: make static-dist

  release-main:
    runs-on: ubuntu-latest
    needs:
      - build-ui-dist
    env:
      SYFT_GOLANG_SEARCH_LOCAL_MOD_CACHE_LICENSES: "true"
      SYFT_GOLANG_SEARCH_REMOTE_LICENSES: "true"
    strategy:
      matrix:
        target:
          - { os: linux,   arch: amd64       }
          - { os: linux,   arch: arm, arm: 6 }
          - { os: linux,   arch: arm64       }
          - { os: linux,   arch: ppc64le     }
          - { os: linux,   arch: riscv64     }
          - { os: linux,   arch: s390x       }
          - { os: hsm,     arch: amd64       }
          - { os: hsm,     arch: arm64       }
          - { os: darwin,  arch: amd64       }
          - { os: darwin,  arch: arm64       }
          - { os: freebsd, arch: amd64       }
          - { os: freebsd, arch: arm64       }
          - { os: freebsd, arch: arm, arm: 6 }
          - { os: netbsd,  arch: amd64       }
          - { os: netbsd,  arch: arm64       }
          - { os: netbsd,  arch: arm, arm: 6 }
          - { os: openbsd, arch: amd64       }
          - { os: openbsd, arch: arm64       }
          - { os: openbsd, arch: arm, arm: 6 }
          - { os: windows, arch: amd64       }
          - { os: windows, arch: arm64       }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Required by GoReleaser.

      - name: Set up Go
        uses: ./.github/actions/set-up-go

      - name: UI Cache Setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            http/web_ui/
          key: ${{ github.ref }}-ui

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          install-only: true
          version: v2.16.0

      - name: Install C compiler for arm64 CGO cross-compilation
        if: matrix.target.os == 'hsm' && matrix.target.arch == 'arm64'
        run: sudo apt install -y gcc-aarch64-linux-gnu

      - name: Run GoReleaser
        run: |
          # Pick the right file:
          file='goreleaser.${{ matrix.target.os }}.yaml'
          [[ ! -f "$file" ]] && file=goreleaser.other.yaml

          # Inject 'goos' and 'goarch':
          query='.builds[0].goos |= ["${{ case(matrix.target.os == 'hsm', 'linux', matrix.target.os) }}"] | .builds[0].goarch |= ["${{ matrix.target.arch }}"]'

          # Inject 'goarm' if defined:
          [[ ! -z '${{ matrix.target.arm }}' ]] && query="$query"' | .builds[0].goarm |= ["${{ matrix.target.arm }}"]'

          # Create the tag locally so goreleaser knows what to target.
          git tag '${{ inputs.version }}'

          yq eval "$query" "$file" \
            | goreleaser release --clean --verbose --timeout=30m -f -
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
